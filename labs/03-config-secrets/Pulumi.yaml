name: lab03-config-secrets
description: "Lab 03 - 스택별 Config 와 Secret 다루기"
runtime: java
config:
  # 프로바이더 설정(네임스페이스가 다른 키)은 value 로 기본값을 지정합니다.
  aws:region:
    value: ap-northeast-2
  # 프로젝트 설정(네임스페이스 생략 = lab03-config-secrets:*)은 타입/기본값/설명을 선언할 수 있습니다.
  environment:
    type: string
    description: "배포 환경 이름 (dev | stg | prod)"
  logRetentionDays:
    type: integer
    default: 7
    description: "CloudWatch Logs 보존 기간(일)"
  owner:
    type: string
    default: platform-team
    description: "리소스 소유 팀 태그"
